<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin – Volta</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/volta.css" />
<style>
  .btn-secondary { padding: 0.65rem 1rem; font-size: 0.9rem; }

  /* ── Sign in ── */
  #loginGate { max-width: 400px; margin: 0 auto; padding: clamp(3rem, 8vw, 6rem) clamp(16px, 4vw, 40px); }
  #loginGate h1 { font-size: 2.2rem; margin-bottom: 0.4rem; }
  #loginGate p { color: var(--slate); margin-bottom: 1.5rem; }
  #loginGate .field { margin-bottom: 0.9rem; }
  #loginGate .btn-primary { width: 100%; }

  .status-msg { margin-top: 0.9rem; padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; display: none; }
  .status-msg.success { background: var(--tint-ok); border: 1px solid var(--ok); color: var(--ok); display: block; }
  .status-msg.error { background: var(--tint-error); border: 1px solid var(--error); color: var(--error); display: block; }

  /* ── Dashboard ── */
  #dashboard { max-width: 960px; margin: 0 auto; padding: clamp(2rem, 5vw, 3rem) clamp(16px, 4vw, 40px) 5rem; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .top-bar h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin-bottom: 0; }
  .top-actions { display: flex; gap: 0.5rem; }

  .panel { padding: 1.5rem; margin-bottom: 1.25rem; }
  .panel-title { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; margin-bottom: 1rem; }

  .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.9rem; margin-bottom: 1.25rem; }
  .settings-field label { display: block; font-size: 0.85rem; color: var(--slate); margin-bottom: 0.3rem; }
  .settings-field input { width: 100%; background: var(--slip); border: 1px solid var(--rule); border-radius: 8px; padding: 0.6rem 0.8rem; color: var(--ink); font: 500 0.95rem var(--body); font-variant-numeric: tabular-nums; }
  .settings-field input:focus { outline: none; border-color: var(--cobalt); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cobalt) 25%, transparent); }

  .project-card { border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); margin-bottom: 0.75rem; }
  .project-card:has(.project-detail.open) { border-color: var(--cobalt); }
  .project-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; cursor: pointer; padding: 1rem 1.15rem; }
  .project-head > span { flex-wrap: wrap; justify-content: flex-end; }
  .project-title { font-weight: 600; font-size: 1.02rem; }
  .project-meta { font-size: 0.85rem; color: var(--slate); overflow-wrap: anywhere; }
  .pill-flag { background: var(--tint-error); color: var(--error); }
  .pill-paid { background: var(--tint-ok); color: var(--ok); }

  .project-detail { display: none; padding: 1rem 1.15rem 1.15rem; border-top: 1px solid var(--rule); background: var(--slip); border-radius: 0 0 12px 12px; }
  .project-detail.open { display: block; }
  .detail-row { font-size: 0.95rem; margin-bottom: 0.5rem; overflow-wrap: anywhere; }
  .detail-row strong { font-weight: 600; }
  .detail-row ul { margin: 0.35rem 0 0 1.1rem; }
  .detail-row code { font-size: 0.85rem; background: var(--paper); padding: 0.1rem 0.35rem; border-radius: 4px; }

  .control-row { display: flex; gap: 0.6rem; margin-top: 0.9rem; flex-wrap: wrap; align-items: center; }
  .control-row .field, .negotiation-row .field { width: auto; flex: 1; min-width: 160px; padding: 0.6rem 0.8rem; font-size: 0.95rem; }
  .control-row span { color: var(--slate); }

  .negotiation-box { background: var(--tint-spark); border: 1px solid color-mix(in srgb, var(--spark) 55%, var(--rule)); border-radius: 10px; padding: 0.9rem 1rem; margin-top: 0.9rem; }
  .negotiation-row { display: flex; gap: 0.6rem; margin-top: 0.7rem; flex-wrap: wrap; align-items: center; }

  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--slate); }
</style>
</head>
<body>

<header class="site">
  <nav class="nav" aria-label="Main">
    <a class="wordmark" href="/" aria-label="Volta home"><svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6L9.5 22l9-11.5h-6z"/></svg><span>Volta</span><small>Admin</small></a>
    <div class="nav-right">
      
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch light or dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </nav>
</header>

<div id="loginGate">
  <h1>Sign in</h1>
  <p>Enter your admin password to continue.</p>
  <input class="field" type="password" id="adminPassword" placeholder="Password" />
  <button class="btn-primary" id="loginBtn">Sign in</button>
  <div class="status-msg" id="loginMsg"></div>
</div>

<div id="dashboard" class="hidden">
  <div class="top-bar">
    <h1>Projects and pricing</h1>
    <div class="top-actions">
      <button class="btn-secondary" id="refreshBtn">Refresh</button>
      <button class="btn-secondary" onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="panel card">
    <div class="panel-title">Pricing minimums</div>
    <div class="settings-grid" id="settingsGrid"></div>
    <button class="btn-secondary" id="saveSettingsBtn">Save pricing</button>
    <div class="status-msg" id="settingsMsg"></div>
  </div>

  <div class="panel card">
    <div class="panel-title">Projects</div>
    <div id="projectList"></div>
  </div>
</div>

<script>
  const API = '';
  // Escape text from the database before putting it into HTML, so a malicious
  // name or brief can't inject script into the page.
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let adminToken = localStorage.getItem('volta_admin_token');

  const loginGate = document.getElementById('loginGate');
  const dashboard = document.getElementById('dashboard');
  const loginMsg = document.getElementById('loginMsg');

  function authHeaders() {
    return { 'Authorization': `Bearer ${adminToken}`, 'Content-Type': 'application/json' };
  }

  function showDashboard() {
    loginGate.classList.add('hidden');
    dashboard.classList.remove('hidden');
    loadSettings();
    loadProjects();
  }

  function logout() {
    localStorage.removeItem('volta_admin_token');
    adminToken = null;
    dashboard.classList.add('hidden');
    loginGate.classList.remove('hidden');
  }

  // If we already have a token, try it straight away
  if (adminToken) showDashboard();

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const password = document.getElementById('adminPassword').value;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';
    loginMsg.className = 'status-msg';
    try {
      const res = await fetch(`${API}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      adminToken = data.token;
      localStorage.setItem('volta_admin_token', adminToken);
      showDashboard();
    } catch (err) {
      loginMsg.textContent = err.message;
      loginMsg.className = 'status-msg error';
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });

  document.getElementById('adminPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  // ── Pricing settings ─────────────────────────────────────────
  const SETTINGS_FIELDS = [
    { key: 'simple_website', label: 'Simple website' },
    { key: 'ecommerce', label: 'E-commerce' },
    { key: 'mobile_app', label: 'Mobile app' },
    { key: 'web_app', label: 'Web app' },
    { key: 'not_sure', label: 'Not sure / other' },
    { key: 'rushMultiplier', label: 'Rush multiplier (e.g. 1.4 = +40%)' },
    { key: 'depositPercentage', label: 'Deposit % charged via Stripe on accept' },
  ];

  async function loadSettings() {
    const res = await fetch(`${API}/api/admin/settings`, { headers: authHeaders() });
    if (res.status === 401) return logout();
    const settings = await res.json();

    const grid = document.getElementById('settingsGrid');
    grid.innerHTML = SETTINGS_FIELDS.map(f => `
      <div class="settings-field">
        <label>${f.label}</label>
        <input type="number" step="0.01" id="setting_${f.key}" value="${settings[f.key] ?? ''}" />
      </div>
    `).join('');
  }

  document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
    const msg = document.getElementById('settingsMsg');
    const payload = {};
    SETTINGS_FIELDS.forEach(f => {
      payload[f.key] = parseFloat(document.getElementById(`setting_${f.key}`).value);
    });
    try {
      const res = await fetch(`${API}/api/admin/settings`, {
        method: 'PUT', headers: authHeaders(), body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      msg.textContent = 'Pricing saved — new quotes will use these values.';
      msg.className = 'status-msg success';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'status-msg error';
    }
  });

  // ── Project list ─────────────────────────────────────────────
  const TYPE_LABELS = {
    simple_website: 'Simple website', ecommerce: 'E-commerce',
    mobile_app: 'Mobile app', web_app: 'Web app', not_sure: 'Not sure',
  };

  async function loadProjects() {
    const list = document.getElementById('projectList');
    const res = await fetch(`${API}/api/requests`, { headers: authHeaders() });
    if (res.status === 401) return logout();
    const projects = await res.json();

    if (!projects.length) {
      list.innerHTML = '<div class="empty-state">No project requests yet.</div>';
      return;
    }

    list.innerHTML = projects.map(p => `
      <div class="project-card">
        <div class="project-head" onclick="toggleDetail('${p._id}')">
          <div>
            <div class="project-title">${esc(p.projectTitle)}</div>
            <div class="project-meta">${esc(p.clientName)} · ${esc(p.clientEmail)} · ${TYPE_LABELS[p.projectType] || esc(p.projectType)} · ${new Date(p.created_at).toLocaleDateString('en-GB')}</div>
          </div>
          <span style="display:flex; align-items:center; gap:0.5rem;">
            ${p.negotiationStatus === 'pending' ? '<span class="status-pill pill-flag">budget proposed</span>' : ''}
            ${p.depositPaid ? '<span class="status-pill pill-paid">deposit paid</span>' : ''}
            ${p.fullPaymentPaid ? '<span class="status-pill pill-paid">paid in full</span>' : ''}
            <span class="status-pill pill-${esc(p.status)}">${esc(p.status.replace('_', ' '))}</span>
          </span>
        </div>
        <div class="project-detail" id="detail-${p._id}">
          <div class="detail-row"><strong>Brief:</strong> ${esc(p.description)}</div>
          ${p.quotedPrice ? `<div class="detail-row"><strong>Quoted:</strong> £${p.quotedPrice.toLocaleString('en-GB')}</div>` : ''}
          ${p.quoteBreakdown && p.quoteBreakdown.length ? `
            <div class="detail-row"><strong>AI quote breakdown:</strong>
              <ul>
                ${p.quoteBreakdown.map(item => `<li>${esc(item.label)}: £${Number(item.amount).toLocaleString('en-GB')}</li>`).join('')}
              </ul>
            </div>` : ''}
          ${p.quoteNotes ? `<div class="detail-row"><strong>AI explanation:</strong> ${esc(p.quoteNotes)}</div>` : ''}
          ${p.depositPaid ? `<div class="detail-row"><strong>Deposit:</strong> £${Number(p.depositAmount).toLocaleString('en-GB')} paid ${p.paidAt ? 'on ' + new Date(p.paidAt).toLocaleDateString('en-GB') : ''}</div>` : ''}
          ${p.fullPaymentPaid ? `<div class="detail-row"><strong>Final payment:</strong> £${Number(p.fullPaymentAmount).toLocaleString('en-GB')} paid ${p.fullPaidAt ? 'on ' + new Date(p.fullPaidAt).toLocaleDateString('en-GB') : ''}</div>` : ''}
          <div class="detail-row"><strong>Timeline:</strong> ${esc(p.timeline.replace(/_/g, ' '))}</div>
          ${p.budgetRange ? `<div class="detail-row"><strong>Budget stated:</strong> ${esc(p.budgetRange)}</div>` : ''}
          <div class="detail-row"><strong>Request ID:</strong> <code>${p._id}</code></div>

          ${p.negotiationStatus === 'pending' ? `
            <div class="negotiation-box">
              <div><strong>£${Number(p.clientBudget).toLocaleString('en-GB')}</strong> proposed by the client (AI quote was £${Number(p.quotedPrice).toLocaleString('en-GB')}).</div>
              <div class="negotiation-row">
                <button class="btn-secondary" onclick="acceptBudget('${p._id}')">Accept £${Number(p.clientBudget).toLocaleString('en-GB')}</button>
                <input class="field" type="number" placeholder="Counter price (£)" id="counterInput-${p._id}" />
                <button class="btn-secondary" onclick="counterBudget('${p._id}')">Send counter</button>
              </div>
            </div>
          ` : ''}
          ${p.negotiationStatus === 'countered' ? `
            <div class="negotiation-box">
              <div>You countered with <strong>£${Number(p.counterPrice).toLocaleString('en-GB')}</strong> — waiting on the client to pay or respond.</div>
            </div>
          ` : ''}
          ${!p.depositPaid && (p.negotiationStatus === 'countered' || p.status === 'accepted') ? `
            <div class="control-row">
              <button class="btn-secondary" onclick="resendPaymentEmail('${p._id}')">Resend payment email</button>
              <span style="font-size:0.85rem;">Client's pay link: <code>/api/requests/${p._id}/pay</code></span>
            </div>
          ` : ''}

          <div class="control-row">
            <select class="field" id="statusSelect-${p._id}">
              <option value="new" ${p.status === 'new' ? 'selected' : ''}>New</option>
              <option value="quoted" ${p.status === 'quoted' ? 'selected' : ''}>Quoted</option>
              <option value="accepted" ${p.status === 'accepted' ? 'selected' : ''}>Accepted</option>
              <option value="in_progress" ${p.status === 'in_progress' ? 'selected' : ''}>In progress</option>
              <option value="rejected" ${p.status === 'rejected' ? 'selected' : ''}>Rejected</option>
            </select>
            <button class="btn-secondary" onclick="updateStatus('${p._id}')">Update status</button>
          </div>

          <div class="control-row">
            <input class="field" type="file" id="fileInput-${p._id}" multiple />
            <button class="btn-secondary" onclick="deliverFiles('${p._id}')">Deliver files</button>
          </div>
          <div class="status-msg" id="actionMsg-${p._id}"></div>
        </div>
      </div>
    `).join('');
  }

  function toggleDetail(id) {
    document.getElementById(`detail-${id}`).classList.toggle('open');
  }

  async function updateStatus(id) {
    const status = document.getElementById(`statusSelect-${id}`).value;
    const msg = document.getElementById(`actionMsg-${id}`);
    try {
      const res = await fetch(`${API}/api/requests/${id}/status`, {
        method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ status }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Update failed');
      msg.textContent = `Status updated to "${status.replace('_', ' ')}".`;
      msg.className = 'status-msg success';
      loadProjects();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'status-msg error';
    }
  }

  // Reload the list, then re-open this project and show the message
  // (otherwise the reload wipes the confirmation before you can see it).
  async function showAfterReload(id, text) {
    await loadProjects();
    const detail = document.getElementById(`detail-${id}`);
    if (detail) detail.classList.add('open');
    const msg = document.getElementById(`actionMsg-${id}`);
    if (msg) { msg.textContent = text; msg.className = 'status-msg success'; }
  }

  async function resendPaymentEmail(id) {
    const msg = document.getElementById(`actionMsg-${id}`);
    msg.textContent = 'Sending...'; msg.className = 'status-msg';
    try {
      const res = await fetch(`${API}/api/requests/${id}/resend-payment-email`, { method: 'POST', headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send the email');
      msg.textContent = data.message; msg.className = 'status-msg success';
    } catch (err) {
      msg.textContent = err.message; msg.className = 'status-msg error';
    }
  }

  async function acceptBudget(id) {
    const msg = document.getElementById(`actionMsg-${id}`);
    try {
      const res = await fetch(`${API}/api/requests/${id}/respond-budget`, {
        method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ action: 'accept' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not accept budget');
      await showAfterReload(id, 'Accepted — the client has been emailed a link to pay their deposit.');
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'status-msg error';
    }
  }

  async function counterBudget(id) {
    const input = document.getElementById(`counterInput-${id}`);
    const msg = document.getElementById(`actionMsg-${id}`);
    const counterPrice = Number(input.value);
    if (!counterPrice || counterPrice <= 0) {
      msg.textContent = 'Enter a valid counter price first.';
      msg.className = 'status-msg error';
      return;
    }
    try {
      const res = await fetch(`${API}/api/requests/${id}/respond-budget`, {
        method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ action: 'counter', counterPrice }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send counter-offer');
      await showAfterReload(id, `Counter of £${counterPrice.toLocaleString('en-GB')} emailed to the client with a payment link.`);
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'status-msg error';
    }
  }

  async function deliverFiles(id) {
    const filesInput = document.getElementById(`fileInput-${id}`);
    const msg = document.getElementById(`actionMsg-${id}`);
    if (!filesInput.files.length) {
      msg.textContent = 'Pick at least one file first.';
      msg.className = 'status-msg error';
      return;
    }
    const formData = new FormData();
    Array.from(filesInput.files).forEach(f => formData.append('files', f));

    try {
      const res = await fetch(`${API}/api/requests/${id}/deliver`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${adminToken}` }, // no Content-Type — browser sets multipart boundary
        body: formData,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Upload failed');
      msg.textContent = `Delivered ${data.request.deliveredFiles.length} file(s). Client notified by email.`;
      msg.className = 'status-msg success';
      loadProjects();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'status-msg error';
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', loadProjects);
  // ── Theme (same setting as the homepage) ─────────────────
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('volta_theme', theme); } catch (e) {}
  }
  function toggleTheme() {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('volta_theme'); } catch (e) {}
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
</script>
</body>
</html>
